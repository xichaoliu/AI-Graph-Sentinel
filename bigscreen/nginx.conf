# DocuGraph Sentinel - 前端静态站点 + API 反向代理
# 该文件会被复制到 /etc/nginx/conf.d/default.conf

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 文档上传（PDF）可能较大
    client_max_body_size 100m;

    # 通过 Docker 内置 DNS 解析 backend，容器重建后无需重启 nginx
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_origin http://backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # 不压缩 text/event-stream，避免 SSE 被缓冲
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 构建产物带内容哈希，可长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # REST API
    location /api/ {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        # LLM / LangGraph 调用可能耗时较长
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE：关闭缓冲，事件即时下发
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }

    # SSE / 内部流式接口
    location /internal/ {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
